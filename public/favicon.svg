<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- El símbolo del convertidor del unifilar: cuadrado con diagonal, "~" (AC) arriba a la izquierda
       y "=" (DC) abajo a la derecha. Los colores son los de la pantalla: el fondo y los trazos. -->
  <rect width="32" height="32" rx="6" fill="#1b1f24"/>
  <rect x="5" y="5" width="22" height="22" fill="none" stroke="#cfd4d9" stroke-width="2"/>
  <line x1="5" y1="27" x2="27" y2="5" stroke="#cfd4d9" stroke-width="2"/>
  <path d="M8 12 q2 -4 4 0 t4 0" fill="none" stroke="#cfd4d9" stroke-width="1.7" stroke-linecap="round"/>
  <line x1="17" y1="22" x2="24" y2="22" stroke="#cfd4d9" stroke-width="1.7" stroke-linecap="round"/>
  <line x1="17" y1="25" x2="24" y2="25" stroke="#cfd4d9" stroke-width="1.7" stroke-linecap="round"/>
</svg>
